<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSS Sync 管理员登录</title>
  <link rel="stylesheet" href="/ui/assets/console.css">
</head>
<body>
  <main class="shell shell--auth">
    <header class="masthead">
      <a class="wordmark" href="/register">
        <span class="wordmark__mark">OS</span>
        <span><strong>OSS Sync</strong><small>Operator console</small></span>
      </a>
      <a class="quiet-link" href="/register">用户注册</a>
    </header>

    <section class="login-frame">
      <div class="login-aside">
        <span class="eyebrow">Restricted ledger</span>
        <h1>控制谁可以进入你的同步服务。</h1>
        <p>管理员面板使用独立的 HttpOnly 会话 Cookie，不会把管理令牌暴露给页面脚本。</p>
      </div>
      <section class="form-sheet form-sheet--compact">
        <span class="eyebrow">Admin access</span>
        <h2>管理员登录</h2>
        {{if .Error}}<div class="notice notice--error" role="alert">{{.Error}}</div>{{end}}
        <form method="post" action="/admin/login" class="stack-form">
          <label>
            <span>管理员用户名</span>
            <input name="username" autocomplete="username" required autofocus>
          </label>
          <label>
            <span>密码</span>
            <input type="password" name="password" autocomplete="current-password" required>
          </label>
          <button class="button button--primary" type="submit">进入控制台</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
