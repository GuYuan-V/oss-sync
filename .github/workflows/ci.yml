name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm exec tsc -- --noEmit
      - run: npm test
      - run: npm run build

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSS_PORT: 18080
      OSS_VERSION: 0.0.0
      OSS_COMMIT: ci
      OSS_BUILT_AT: unknown
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: curl --fail --silent --show-error http://127.0.0.1:18080/readyz
      - name: Smoke test one-command installer
        env:
          OSS_IMAGE: oss-sync-backend:local
          OSS_CONTAINER_NAME: oss-sync-install-test
          OSS_DATA_VOLUME: oss-install-test
          OSS_PORT: 18081
          OSS_SKIP_PULL: 1
        run: |
          bash -n install.sh
          bash install.sh
          curl --fail --silent --show-error http://127.0.0.1:18081/readyz
      - if: failure()
        run: docker compose logs backend
      - if: always()
        run: |
          docker rm -f oss-sync-install-test 2>/dev/null || true
          docker volume rm oss-install-test 2>/dev/null || true
          docker compose down --volumes
