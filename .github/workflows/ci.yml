name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm exec tsc -- --noEmit
      - run: npm test
      - run: npm run build
