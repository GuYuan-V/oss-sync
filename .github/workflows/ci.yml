name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm exec tsc -- --noEmit
      - run: npm test
      - run: npm run build

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSS_PORT: 18080
      OSS_VERSION: 0.0.0
      OSS_COMMIT: ci
      OSS_BUILT_AT: unknown
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: curl --fail --silent --show-error http://127.0.0.1:18080/readyz
      - name: Smoke test one-command installer
        env:
          OSS_CONTAINER_NAME: oss-sync-install-test
          OSS_DATA_VOLUME: oss-install-test
          OSS_PORT: 18081
          OSS_INSTALL_DIR: ${{ runner.temp }}/oss-install-test
          OSS_STORAGE_LIMIT_GB: 1
        run: |
          bash -n install.sh
          no_docker_path="$(mktemp -d)"
          ln -s "$(command -v id)" "$no_docker_path/id"
          ln -s "$(command -v uname)" "$no_docker_path/uname"
          if OSS_PORT= PATH="$no_docker_path" /usr/bin/bash install.sh >"$RUNNER_TEMP/install-no-docker.log" 2>&1; then exit 1; fi
          grep -F "非交互安装请设置 OSS_INSTALL_DOCKER=1" "$RUNNER_TEMP/install-no-docker.log"
          random_port="$(sed -n 's/^\[OSS\] 未指定端口，随机选择：//p' "$RUNNER_TEMP/install-no-docker.log")"
          [[ "$random_port" =~ ^[0-9]+$ ]] && ((random_port >= 10000 && random_port <= 25565))
          case "$random_port" in 10000|10050|10051|11211|12345|15672|18080|19000|20000|22000|25565) exit 1 ;; esac
          release_dir="$RUNNER_TEMP/oss-release"
          mkdir -p "$release_dir"
          docker tag oss-sync-backend:local oss-sync-server:release
          docker save oss-sync-server:release | gzip -9 > "$release_dir/oss-sync-image_linux_amd64.tar.gz"
          (cd "$release_dir" && sha256sum oss-sync-image_linux_amd64.tar.gz > checksums.txt)
          OSS_RELEASE_BASE_URL="file://$release_dir" OSS_RELEASE_PROXY=official bash install.sh
          curl --fail --silent --show-error http://127.0.0.1:18081/readyz
          test "$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' oss-sync-install-test | sed -n 's/^OSS_STORAGE_MAX_TOTAL_SIZE_MB=//p')" = "1024"
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Source}}{{end}}{{end}}' oss-sync-install-test)" = "$OSS_INSTALL_DIR/data"
      - if: failure()
        run: docker compose logs backend
      - if: always()
        run: |
          docker rm -f oss-sync-install-test 2>/dev/null || true
          docker volume rm oss-install-test 2>/dev/null || true
          docker compose down --volumes
